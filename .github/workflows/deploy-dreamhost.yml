name: Deploy to DreamHost

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  # Allow manual deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    name: Deploy to DreamHost via SSH
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      
      - name: Deploy application files
        env:
          REMOTE_USER: ${{ secrets.DREAMHOST_USER }}
          REMOTE_HOST: ${{ secrets.DREAMHOST_HOST }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          # Validate required secrets are set
          if [ -z "$REMOTE_USER" ] || [ -z "$REMOTE_HOST" ] || [ -z "$REMOTE_PATH" ]; then
            echo "ERROR: Required secrets not set (DREAMHOST_USER, DREAMHOST_HOST, DREAMHOST_PATH)"
            exit 1
          fi
          
          # Create deployment directory structure on remote if needed
          ssh "${REMOTE_USER}@${REMOTE_HOST}" "mkdir -p \"${REMOTE_PATH}\""
          
          # Deploy application files using rsync
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.Python' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='ENV' \
            --exclude='cache' \
            --exclude='test_images' \
            --exclude='*.swp' \
            --exclude='*.swo' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='config.local.ini' \
            --exclude='.gitignore' \
            --exclude='tests' \
            --exclude='.pytest_cache' \
            --exclude='run_local.py' \
            ./ "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"
      
      - name: Set file permissions
        env:
          REMOTE_USER: ${{ secrets.DREAMHOST_USER }}
          REMOTE_HOST: ${{ secrets.DREAMHOST_HOST }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          ssh "${REMOTE_USER}@${REMOTE_HOST}" "export REMOTE_PATH='${REMOTE_PATH}' && bash -s" << 'ENDSSH'
          set -e  # Exit on error
          
          # Validate REMOTE_PATH is set
          if [ -z "$REMOTE_PATH" ]; then
            echo "ERROR: REMOTE_PATH is not set"
            exit 1
          fi
          
          cd "$REMOTE_PATH" || exit 1
          
          # Make dispatch scripts executable
          chmod 755 dispatch.fcgi dispatch.cgi
          
          # Make main application readable
          chmod 644 app.py
          
          # Ensure .htaccess is readable
          chmod 644 .htaccess
          
          # Create cache directory if it doesn't exist
          mkdir -p cache
          chmod 755 cache
          
          echo "File permissions set successfully"
          ENDSSH
      
      - name: Install/update Python dependencies
        env:
          REMOTE_USER: ${{ secrets.DREAMHOST_USER }}
          REMOTE_HOST: ${{ secrets.DREAMHOST_HOST }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_PATH }}
          # Optional repository variable: python interpreter to use, e.g. python3.11
          REMOTE_PYTHON: ${{ vars.DREAMHOST_PYTHON }}
        run: |
          ssh "${REMOTE_USER}@${REMOTE_HOST}" "export REMOTE_PATH='${REMOTE_PATH}' REMOTE_PYTHON='${REMOTE_PYTHON}' && bash -s" << 'ENDSSH'
          set -e  # Exit on error
          
          # Validate REMOTE_PATH is set
          if [ -z "$REMOTE_PATH" ]; then
            echo "ERROR: REMOTE_PATH is not set"
            exit 1
          fi
          
          cd "$REMOTE_PATH" || exit 1
          
          # Pick a Python interpreter. The default `python3` on shared hosting is often too
          # old (Pillow>=10.2 needs 3.8+; CI covers 3.9+). Use the DREAMHOST_PYTHON repo
          # variable if set, otherwise the newest python3.x found on PATH.
          PY=""
          if [ -n "$REMOTE_PYTHON" ]; then
            PY="$REMOTE_PYTHON"
          else
            for v in 3.13 3.12 3.11 3.10 3.9; do
              if command -v "python$v" >/dev/null 2>&1; then PY="python$v"; break; fi
            done
          fi
          if [ -z "$PY" ] || ! command -v "$PY" >/dev/null 2>&1; then
            echo "ERROR: no suitable Python (3.9+) found on the server."
            echo "Default python3 is: $(python3 --version 2>&1)"
            echo "Available: $(ls /usr/bin/python3* /usr/local/bin/python3* 2>/dev/null | tr '\n' ' ')"
            echo "Install a newer Python and set the DREAMHOST_PYTHON repository variable (e.g. python3.11 or an absolute path)."
            exit 1
          fi
          if ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'; then
            echo "ERROR: $PY is $("$PY" --version 2>&1); Python 3.9+ is required."
            exit 1
          fi
          echo "Using $PY ($("$PY" --version 2>&1))"

          # Rebuild the venv if it is missing, broken, or built with a different Python
          if [ -d venv ]; then
            if ! venv/bin/python3 -m pip --version >/dev/null 2>&1 || \
               [ "$(venv/bin/python3 -c 'import sys; print(sys.version_info[:2])' 2>/dev/null)" != "$("$PY" -c 'import sys; print(sys.version_info[:2])')" ]; then
              echo "Existing venv is broken or uses a different Python; recreating..."
              rm -rf venv
            fi
          fi

          # Create virtual environment if it doesn't exist
          if [ ! -d venv ]; then
            echo "Creating virtual environment..."
            if ! "$PY" -m venv venv; then
              # ensurepip/python3-venv is often unavailable on shared hosting:
              # create the venv without pip and bootstrap pip separately.
              echo "venv with ensurepip failed; bootstrapping pip with get-pip.py..."
              rm -rf venv
              "$PY" -m venv --without-pip venv || exit 1
              GET_PIP="$(mktemp)"
              curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$GET_PIP" || exit 1
              venv/bin/python3 "$GET_PIP" || exit 1
              rm -f "$GET_PIP"
            fi
          fi

          # Call pip via the venv's interpreter rather than relying on activation
          venv/bin/python3 -m pip install --upgrade pip || exit 1
          venv/bin/python3 -m pip install -r requirements.txt || exit 1

          echo "Dependencies installed/updated successfully"
          ENDSSH
      
      - name: Deployment summary
        env:
          REMOTE_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          echo "✅ Deployment to DreamHost completed successfully!"
          echo "Files deployed to: ${REMOTE_PATH}"
